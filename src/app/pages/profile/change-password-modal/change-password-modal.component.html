<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Change Password</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-shell">
    <p class="modal-desc">Enter a new password for your account. It must be at least 6 characters long.</p>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <input 
          [(ngModel)]="newPassword" 
          [type]="showPassword ? 'text' : 'password'" 
          placeholder="Min. 6 characters" 
          class="form-input" 
        />
        <ion-icon 
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" 
          class="toggle-icon" 
          (click)="showPassword = !showPassword"
        ></ion-icon>
      </div>
    </div>

    <button type="button" class="btn-primary" (click)="updatePassword()" [disabled]="newPassword.length < 6 || isUpdating">
      <ion-icon name="checkmark-circle-outline" *ngIf="!isUpdating"></ion-icon>
      {{ isUpdating ? 'Updating...' : 'Update Password' }}
    </button>
  </div>
</ion-content>
